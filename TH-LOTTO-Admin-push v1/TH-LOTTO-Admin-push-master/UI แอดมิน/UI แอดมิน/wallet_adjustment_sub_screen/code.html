<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>การปรับกระเป๋าเงินสมาชิก</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "secondary-container": "#6cf8bb",
                "secondary-fixed": "#6ffbbe",
                "surface-container": "#e5eeff",
                "surface-variant": "#d3e4fe",
                "on-secondary-fixed": "#002113",
                "primary-fixed": "#b0f0d6",
                "inverse-surface": "#213145",
                "background": "#f8f9ff",
                "tertiary-fixed-dim": "#bdcac1",
                "on-surface-variant": "#404944",
                "surface-container-low": "#eff4ff",
                "surface-container-highest": "#d3e4fe",
                "error": "#ba1a1a",
                "surface": "#f8f9ff",
                "on-tertiary-fixed": "#131e19",
                "surface-bright": "#f8f9ff",
                "on-error-container": "#93000a",
                "inverse-primary": "#95d3ba",
                "on-secondary-container": "#00714d",
                "surface-container-high": "#dce9ff",
                "on-tertiary": "#ffffff",
                "on-secondary": "#ffffff",
                "outline-variant": "#bfc9c3",
                "error-container": "#ffdad6",
                "on-background": "#0b1c30",
                "outline": "#707974",
                "on-tertiary-container": "#a8b5ad",
                "surface-container-lowest": "#ffffff",
                "surface-tint": "#2b6954",
                "inverse-on-surface": "#eaf1ff",
                "primary-fixed-dim": "#95d3ba",
                "on-primary-fixed-variant": "#0b513d",
                "surface-dim": "#cbdbf5",
                "on-primary-container": "#80bea6",
                "secondary": "#006c49",
                "on-tertiary-fixed-variant": "#3e4943",
                "tertiary-container": "#3b4741",
                "tertiary": "#25312b",
                "primary": "#003527",
                "on-secondary-fixed-variant": "#005236",
                "secondary-fixed-dim": "#4edea3",
                "on-surface": "#0b1c30",
                "primary-container": "#064e3b",
                "on-primary": "#ffffff",
                "on-error": "#ffffff",
                "on-primary-fixed": "#002117",
                "tertiary-fixed": "#d9e6dd"
        },
        "borderRadius": {
                "DEFAULT": "1rem",
                "lg": "2rem",
                "xl": "3rem",
                "full": "9999px"
        },
        "spacing": {
                "gutter": "24px",
                "xl": "40px",
                "unit": "4px",
                "sm": "8px",
                "xs": "4px",
                "container-padding": "32px",
                "md": "16px",
                "lg": "24px"
        },
        "fontFamily": {
                "label-sm": [
                        "Prompt"
                ],
                "body-md": [
                        "Prompt"
                ],
                "h3": [
                        "Prompt"
                ],
                "h2": [
                        "Prompt"
                ],
                "h1": [
                        "Prompt"
                ],
                "button": [
                        "Prompt"
                ],
                "body-lg": [
                        "Prompt"
                ]
        },
        "fontSize": {
                "label-sm": [
                        "14px",
                        {
                                "lineHeight": "1.2",
                                "letterSpacing": "0.05em",
                                "fontWeight": "500"
                        }
                ],
                "body-md": [
                        "16px",
                        {
                                "lineHeight": "1.6",
                                "letterSpacing": "0",
                                "fontWeight": "400"
                        }
                ],
                "h3": [
                        "24px",
                        {
                                "lineHeight": "1.4",
                                "letterSpacing": "0",
                                "fontWeight": "500"

                ],
                "h2": [
                        "32px",
                        {
                                "lineHeight": "1.3",
                                "letterSpacing": "-0.01em",
                                "fontWeight": "600"
                        }
                ],
                "h1": [
                        "48px",
                        {
                                "lineHeight": "1.2",
                                "letterSpacing": "-0.02em",
                                "fontWeight": "600"
                        }
                ],
                "button": [
                        "16px",
                        {
                                "lineHeight": "1",
                                "letterSpacing": "0.02em",
                                "fontWeight": "600"
                        }
                ],
                "body-lg": [
                        "18px",
                        {
                                "lineHeight": "1.6",
                                "letterSpacing": "0",
                                "fontWeight": "400"
                        }
                ]
        }
},
    },
  }
</script>
<style>
    /* Custom scrollbar for webkit */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: #bfc9c3;
        border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #707974;
    }
</style>
</head>
<body class="bg-surface-container font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-md lg:p-xl relative overflow-hidden">
<!-- Ambient Background Elements to enhance the "Capsule" feel -->
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-primary-fixed/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] bg-secondary-container/20 rounded-full blur-[80px] pointer-events-none"></div>
<!-- Modal Canvas (The Capsule) -->
<main class="w-full max-w-[560px] bg-surface-container-lowest rounded-xl shadow-[0_20px_50px_-12px_rgba(0,53,39,0.15)] overflow-hidden flex flex-col relative z-10 border border-white/60 backdrop-blur-xl">
<!-- Header -->
<header class="flex items-center justify-between px-lg py-md border-b border-outline-variant/20 bg-surface-container-lowest/80 backdrop-blur-md">
<div class="flex items-center gap-md">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low text-on-surface-variant transition-colors group">
<span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform duration-200">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 text-primary tracking-tight">ปรับสมดุลกระเป๋าเงิน</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low text-on-surface-variant transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Content Body -->
<div class="p-container-padding flex flex-col gap-xl">
<!-- Context: Member Info & Current Balance -->
<div class="flex flex-col gap-md">
<div class="flex items-center gap-md bg-surface-container-low p-md rounded-lg border border-outline-variant/10">
<div class="w-12 h-12 rounded-full overflow-hidden bg-primary-container/10 flex-shrink-0">
<img alt="Avatar" class="w-full h-full object-cover" data-alt="Portrait of a young professional male in a crisp shirt, soft lighting, neutral background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3wxov9B6LTpRaDDogjR8XcmH-Jv2T3K0PJhRCfssrfpGTeyWlxuHRUN23GN9ZMEEaUWQZwd7GIwB6EMqQvZcIGNyPDYsTlIbMr-c5x9rTyVxI-Kd118PSlfGIRzYfUXOoW3g6ZMzd04I5MNyn9kzEtrbQtbxZTbe8VyRV7VFldHK9ozfBL4TENQRReiuu1IyppnRl-4BGHvfj_wEiVV6CHBHP9QTjLzru-noGAW-oZtJZiFohdDjMhkLaWxE9O2EMzTtNZGKLBy-9"/>
</div>
<div class="flex-1 min-w-0">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">สมาชิกเป้าหมาย</p>
<p class="font-body-lg text-body-lg text-primary font-medium truncate">มาร์คัส เฉิน</p>
<p class="font-label-sm text-label-sm text-outline">รหัส: MC-88291</p>
</div>
</div>
<div class="bg-primary-container p-lg rounded-lg flex flex-col items-center justify-center relative overflow-hidden shadow-inner border border-primary/10">
<!-- Subtle background pattern inside balance card -->
<div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white to-transparent pointer-events-none"></div>
<p class="font-label-sm text-label-sm text-on-primary-container/80 uppercase tracking-widest mb-2 relative z-10">ยอดเงินปัจจุบัน</p>
<div class="flex items-baseline gap-2 relative z-10">
<span class="font-h3 text-h3 text-on-primary-container opacity-80">$</span>
<span class="font-h1 text-h1 text-on-primary-container tracking-tighter">12,450.00</span>
</div>
</div>
</div>
<hr class="border-outline-variant/20"/>
<!-- Adjustment Form -->
<form class="flex flex-col gap-lg">
<!-- Action Type Toggle -->
<div class="bg-surface-container-low p-1 rounded-full flex gap-1 border border-outline-variant/20">
<!-- Add Option (Active State styling applied statically for design demonstration) -->
<label class="flex-1 relative cursor-pointer group">
<input checked="" class="peer sr-only" name="adjustment_type" type="radio" value="add"/>
<div class="py-md text-center rounded-full font-button text-button transition-all duration-300 peer-checked:bg-primary peer-checked:text-on-primary peer-checked:shadow-md text-on-surface-variant group-hover:bg-surface-variant/50 peer-checked:group-hover:bg-primary flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
                            เพิ่มเงิน
                        </div>
</label>
<!-- Deduct Option -->
<label class="flex-1 relative cursor-pointer group">
<input class="peer sr-only" name="adjustment_type" type="radio" value="deduct"/>
<div class="py-md text-center rounded-full font-button text-button transition-all duration-300 peer-checked:bg-error peer-checked:text-on-error peer-checked:shadow-md text-on-surface-variant group-hover:bg-surface-variant/50 peer-checked:group-hover:bg-error flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">do_not_disturb_on</span>
                            หักเงิน
                        </div>
</label>
</div>
<!-- Amount Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant pl-4">จำนวนเงินที่ปรับ</label>
<div class="relative flex items-center">
<span class="absolute left-6 font-h3 text-h3 text-outline material-symbols-outlined">attach_money</span>
<input class="w-full bg-surface-container-low border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest rounded-full py-md pl-14 pr-lg font-h3 text-h3 text-on-surface placeholder:text-outline-variant transition-all duration-300 shadow-sm focus:shadow-[0_0_0_4px_rgba(0,53,39,0.1)] outline-none appearance-none" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Reason Dropdown -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant pl-4">เหตุผล <span class="text-error">*</span></label>
<div class="relative flex items-center">
<select class="w-full bg-surface-container-low border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest rounded-full py-md pl-6 pr-14 font-body-lg text-body-lg text-on-surface transition-all duration-300 shadow-sm focus:shadow-[0_0_0_4px_rgba(0,53,39,0.1)] outline-none appearance-none cursor-pointer">
<option disabled="" selected="" value="">เลือกเหตุผล...</option>
<option value="bonus">โบนัสโปรโมชั่น</option>
<option value="correction">แก้ไขด้วยตนเอง</option>
<option value="refund">คืนเงินจากระบบ</option>
<option value="penalty">ค่าปรับการละเมิด</option>
<option value="other">อื่นๆ (ต้องระบุหมายเหตุ)</option>
</select>
<span class="absolute right-6 text-outline pointer-events-none material-symbols-outlined">expand_more</span>
</div>
</div>
<!-- Security PIN -->
<div class="flex flex-col gap-sm mt-4">
<label class="font-label-sm text-label-sm text-on-surface-variant pl-4 flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-primary">lock</span>
                        PIN ยืนยันตัวตน
                    </label>
<input class="w-32 bg-surface-container-low border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest rounded-full py-md px-lg font-h3 text-h3 text-center text-on-surface tracking-widest placeholder:tracking-normal placeholder:text-outline-variant transition-all duration-300 shadow-sm focus:shadow-[0_0_0_4px_rgba(0,53,39,0.1)] outline-none" maxlength="4" placeholder="••••" type="password"/>
</div>
</form>
</div>
<!-- Footer Actions -->
<div class="px-container-padding py-lg bg-surface-container-low/50 border-t border-outline-variant/20 flex items-center justify-end gap-md">
<button class="px-lg py-md rounded-full font-button text-button text-on-surface-variant hover:bg-surface-container-highest transition-colors duration-200" type="button">
                ยกเลิก
            </button>
<button class="px-xl py-md rounded-full font-button text-button bg-primary text-on-primary hover:scale-[1.02] shadow-lg shadow-primary/20 transition-transform duration-300 flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
                ยืนยันการปรับปรุง
            </button>
</div>
</main>
</body></html>
