<body class="bg-background min-h-screen flex items-center justify-center font-body-md text-body-md text-on-surface antialiased overflow-hidden relative">
<div class="absolute inset-0 bg-surface-container-highest opacity-50 z-0"></div>
<div class="absolute -top-[40%] -right-[20%] w-[80%] h-[80%] rounded-full bg-primary-container opacity-5 blur-[120px] pointer-events-none z-0"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-secondary-container opacity-10 blur-[100px] pointer-events-none z-0"></div>
<main class="relative z-10 w-full max-w-[480px] p-container-padding">
<div class="glass-panel rounded-xl shadow-[0_20px_50px_rgba(6,78,59,0.05)] p-xl flex flex-col gap-xl">
<div class="flex flex-col items-center text-center gap-sm">
<div class="w-16 h-16 rounded-full bg-primary-container text-on-primary flex items-center justify-center mb-md shadow-lg shadow-primary-container/20">
<span class="material-symbols-outlined text-h2 font-h2" style="font-variation-settings: 'FILL' 1;">shield_person</span>
</div>
<h1 class="font-h2 text-h2 text-primary">THLotto</h1>
<p class="font-body-md text-body-md text-on-surface-variant">ระบบยืนยันตัวตนระดับบริหาร</p>
</div>
<form class="flex flex-col gap-lg">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-sm" for="phone">เบอร์โทรศัพท์</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline">call</span>
<input class="w-full bg-surface-container-low border-none rounded-full py-md pl-[52px] pr-md font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" id="phone" placeholder="กรอกเบอร์โทรศัพท์ผู้บริหาร" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-sm" for="pin">รหัส PIN 4 หลัก</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline">dialpad</span>
<input class="w-full bg-surface-container-low border-none rounded-full py-md pl-[52px] pr-md font-body-md text-body-md text-on-surface tracking-widest placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all text-center" id="pin" maxlength="4" placeholder="••••" type="password"/>
</div>
</div>
<button class="mt-md w-full bg-primary text-on-primary rounded-full py-md px-lg font-button text-button shadow-[0_8px_20px_rgba(6,78,59,0.2)] hover:scale-[1.02] active:scale-95 transition-all duration-200 ease-out flex items-center justify-center gap-sm" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
                    เข้าสู่ระบบ
                </button>
</form>
<div class="text-center mt-sm">
<p class="font-label-sm text-label-sm text-outline flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px]">lock</span>
                    การเชื่อมต่อที่ปลอดภัยและเข้ารหัส
                </p>
