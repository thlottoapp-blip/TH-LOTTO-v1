<body class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen flex flex-col selection:bg-primary/20 selection:text-primary">
<!-- Intent Logic Execution: This is a Task-Focused, Linear setup screen. 
         Global navigation (TopNavBar, SideNavBar) is suppressed to prioritize the Canvas and focus the user journey. -->
<!-- Top Action Bar (Contextual Header) -->
<header class="sticky top-0 z-50 bg-background/80 backdrop-blur-xl border-b border-surface-container-high px-8 h-20 flex justify-between items-center shrink-0">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors group">
<span class="material-symbols-outlined text-[20px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span class="font-button text-button">ยกเลิกการตั้งค่า</span>
</button>
<div class="text-center">
<h1 class="font-h3 text-h3 text-primary">บัญชีรับฝากเงินใหม่</h1>
</div>
<button class="bg-primary text-on-primary font-button text-button px-8 py-3 rounded-full hover:scale-[1.02] transition-transform shadow-[0_8px_20px_-8px_rgba(0,53,39,0.4)] flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            เปิดใช้งานบัญชี
        </button>
</header>
<!-- Main Canvas -->
<main class="flex-1 w-full max-w-4xl mx-auto p-container-padding pb-32">
<div class="space-y-gutter">
<!-- Section 1: Provider Selection -->
<section class="bg-surface-container-lowest rounded-lg p-xl shadow-[0_15px_40px_-15px_rgba(0,53,39,0.08)] border border-surface-container-lowest relative overflow-hidden">
<!-- Subtle glass highlight -->
<div class="absolute inset-0 border border-white/60 rounded-lg pointer-events-none"></div>
<header class="mb-8">
<h2 class="font-h3 text-h3 text-on-surface mb-2">เลือกผู้ให้บริการ</h2>
<p class="font-body-md text-body-md text-on-surface-variant">เลือกสถาบันการเงินสำหรับช่องทางการรับฝากเงินนี้</p>
</header>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
<!-- Active Bank Selection -->
<label class="group cursor-pointer relative">
<input checked="" class="peer sr-only" name="bank_provider" type="radio"/>
<div class="h-32 flex flex-col items-center justify-center gap-3 rounded-[24px] bg-surface border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary/5 transition-all duration-300 hover:bg-surface-container peer-checked:shadow-[0_0_20px_-5px_rgba(0,53,39,0.15)]">
<div class="w-12 h-12 rounded-full bg-[#118A44]/10 flex items-center justify-center text-[#118A44]">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface peer-checked:text-primary peer-checked:font-bold">กสิกรไทย</span>
</div>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
<!-- Inactive Bank Selection -->
<label class="group cursor-pointer relative">
<input class="peer sr-only" name="bank_provider" type="radio"/>
<div class="h-32 flex flex-col items-center justify-center gap-3 rounded-[24px] bg-surface border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary/5 transition-all duration-300 hover:bg-surface-container">
<div class="w-12 h-12 rounded-full bg-[#4E2A84]/10 flex items-center justify-center text-[#4E2A84]">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">ไทยพาณิชย์</span>
</div>
</label>
<!-- Inactive Bank Selection -->
<label class="group cursor-pointer relative">
<input class="peer sr-only" name="bank_provider" type="radio"/>
<div class="h-32 flex flex-col items-center justify-center gap-3 rounded-[24px] bg-surface border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary/5 transition-all duration-300 hover:bg-surface-container">
<div class="w-12 h-12 rounded-full bg-[#1D4F91]/10 flex items-center justify-center text-[#1D4F91]">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">กรุงเทพ</span>
</div>
</label>

<div class="w-12 h-12 rounded-full bg-[#00AEEF]/10 flex items-center justify-center text-[#00AEEF]">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">กรุงไทย</span>
</div>
</label>

<div class="absolute inset-0 border border-white/60 rounded-lg pointer-events-none"></div>

<h2 class="font-h3 text-h3 text-on-surface mb-2">รายละเอียดบัญชี</h2>

</div>
<input class="w-full bg-surface-container-low border-none rounded-full py-4 pl-12 pr-6 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all shadow-inner" id="account_name" placeholder="เช่น บจก. ทีเอชล็อตโต้ คอร์ปอเรท" type="text"/>
</div>

<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">pin</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-full py-4 pl-12 pr-6 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all shadow-inner tracking-widest" id="account_number" placeholder="000-0-00000-0" type="text"/>
</div>

</div>
</div>
<!-- Custom Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer shrink-0 ml-4">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-14 h-8 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary shadow-inner"></div>
</label>
